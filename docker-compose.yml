version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campus_club_db
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_USER: campus_admin
      MYSQL_PASSWORD: campus_secure_pass_456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: ./django_app
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 campus_portal.wsgi:application"
    volumes:
      - ./django_app/media:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=production-django-secret-key-replace-in-env
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=campus_club_db
      - DB_USER=campus_admin
      - DB_PASSWORD=campus_secure_pass_456
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db

volumes:
  mysql_data:
